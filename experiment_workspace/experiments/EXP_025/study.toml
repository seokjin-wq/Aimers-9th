[study]
id = "025_catboost_learning_path"
description = "CatBoost 학습률-트리수 경로"
hypothesis = "총 boosting 강도를 비슷하게 유지하면서 작은 학습률과 많은 tree를 쓰면 기존 300x0.05보다 일반화 Brier가 개선된다"
protocol = "holdout_2024"
change_scope = ["model"]
control = "d6_i300_lr050_control"

[[variants]]
name = "d6_i300_lr050_control"
model = "catboost_native_scale106_shift_m008"
features = "main60_cat_batter_team"
change = "control: depth6, 300, lr0.05"

