[study]
id = "121_histgb_fourth_blend"
description = "Rule-compliant HistGB fourth-model blend"
hypothesis = "A small HistGradientBoosting component can reduce correlated CatBoost/ExtraTrees errors despite weaker standalone Brier, improving the reliability-enhanced ensemble through diversity."
protocol = "holdout_2024"
change_scope = ["model"]
control = "hist_weight_0_control"

[[variants]]
name = "hist_weight_0_control"
model = "quad_hist0_count_m0095_sub08_w50_35_15"
features = "main78_history_reliability"
change = "control: train HistGB but assign weight 0; CPU/GPU/Extra=50/35/15"

[[variants]]
name = "hist_weight_025"
model = "quad_hist025_count_m0095_sub08"
features = "main78_history_reliability"
change = "replace 2.5% ExtraTrees weight with HistGB only"

[[variants]]
name = "hist_weight_05"
model = "quad_hist05_count_m0095_sub08"
features = "main78_history_reliability"
change = "replace 5% ExtraTrees weight with HistGB only"
