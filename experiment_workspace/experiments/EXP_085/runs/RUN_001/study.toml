[study]
id = "085_history_missingness"
description = "EDA 기반 최근·선수 이력 결측 신호 재검증"
hypothesis = "결측 여부 자체가 시즌 초와 신규 선수 상태를 나타내므로 현재 강한 모델에서도 추가 신호를 준다."
protocol = "holdout_2024"
change_scope = ["features"]
control = "count_hands_control"

[[variants]]
name = "count_hands_control"
model = "catboost_d8_decay085"
features = "main69_cat_count_hands"
change = "control: EXP_080 CPU count+hands base"

[[variants]]
name = "recent_missing"
model = "catboost_d8_decay085"
features = "main70_cat_count_hands_recent_missing"
change = "직전 경기 성공률 결측 여부만 추가"

[[variants]]
name = "pitcher_missing"
model = "catboost_d8_decay085"
features = "main70_cat_count_hands_pitcher_missing"
change = "투수 통산 성공률 결측 여부만 추가"

[[variants]]
name = "batter_missing"
model = "catboost_d8_decay085"
features = "main70_cat_count_hands_batter_missing"
change = "타자 상대 통산 성공률 결측 여부만 추가"

[[variants]]
name = "all_missing"
model = "catboost_d8_decay085"
features = "main72_cat_count_hands_all_missing"
change = "최근·투수·타자 이력 결측 플래그 3개 동시 추가"
