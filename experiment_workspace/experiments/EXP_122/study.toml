[study]
id = "122_extended_reliability_rates"
description = "Extended pitcher-history reliability rates"
hypothesis = "Reliability weighting that helped success/reverse/middle may also stabilize noisy pitcher ball/strike and pitch-mix rates for low-history pitchers."
protocol = "holdout_2024"
change_scope = ["features"]
control = "main78_control"

[[variants]]
name = "main78_control"
model = "catboost_d8_decay085_sub08"
features = "main78_history_reliability"
change = "control: six-feature history reliability winner"

[[variants]]
name = "add_ball_strike_reliability"
model = "catboost_d8_decay085_sub08"
features = "main80_reliability_ball_strike"
change = "add reliability-weighted pitcher ball and strike rates only"

[[variants]]
name = "add_pitchmix_reliability"
model = "catboost_d8_decay085_sub08"
features = "main81_reliability_pitchmix"
change = "add reliability-weighted fastball, breaking, and offspeed rates only"

[[variants]]
name = "add_all_extended_rates"
model = "catboost_d8_decay085_sub08"
features = "main83_reliability_all_rates"
change = "add all five extended reliability-weighted rates"
