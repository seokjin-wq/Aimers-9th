[study]
id = "069_season_state_gpu_capacity"
description = "시즌 상태 GPU 고용량 CatBoost"
hypothesis = "GPU의 더 많은 border와 450~900 trees가 현재 시즌 상태의 세밀한 비선형 잔차를 CPU depth8보다 잘 포착한다"
protocol = "holdout_2024"
change_scope = ["model"]
control = "cpu_d8"

[[variants]]
name = "cpu_d8"
model = "catboost_d8_decay085"
features = "main69_pitcher_batter_season_all"
change = "control: CPU depth8 300"

[[variants]]
name = "gpu_d6_i900"
model = "catboost_gpu_d6_i900_decay85"
features = "main69_pitcher_batter_season_all"
change = "GPU depth6 900 lr0.02 border128"

[[variants]]
name = "gpu_d7_i600"
model = "catboost_gpu_d7_i600_decay85"
features = "main69_pitcher_batter_season_all"
change = "GPU depth7 600 lr0.025 border128"

[[variants]]
name = "gpu_d8_i450"
model = "catboost_gpu_d8_i450_decay85"
features = "main69_pitcher_batter_season_all"
change = "GPU depth8 450 lr0.025 border128"
