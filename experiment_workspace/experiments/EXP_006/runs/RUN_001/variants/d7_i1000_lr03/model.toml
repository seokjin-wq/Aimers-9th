[model]
name = "catboost_d7_i1000_lr03"
family = "catboost"
native_categorical = true

[model.params]
iterations = 1000
depth = 7
learning_rate = 0.03
l2_leaf_reg = 3.0
subsample = 0.7
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "Logloss"
eval_metric = "BrierScore"
allow_writing_files = false
verbose = false
