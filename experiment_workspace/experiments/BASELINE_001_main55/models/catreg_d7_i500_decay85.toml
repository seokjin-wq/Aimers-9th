[model]
name = "catreg_d7_i500_decay85"
family = "catboost_regressor"
native_categorical = true
season_decay = 0.85
[model.params]
iterations = 500
depth = 7
learning_rate = 0.03
l2_leaf_reg = 3.0
subsample = 0.7
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "RMSE"
eval_metric = "RMSE"
allow_writing_files = false
verbose = false

