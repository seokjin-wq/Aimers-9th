[model]
name = "catboost_native_random0"
family = "catboost"
native_categorical = true
[model.params]
iterations = 300
depth = 6
learning_rate = 0.05
l2_leaf_reg = 3.0
random_strength = 0.0
subsample = 0.7
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "Logloss"
eval_metric = "BrierScore"
allow_writing_files = false
verbose = false
