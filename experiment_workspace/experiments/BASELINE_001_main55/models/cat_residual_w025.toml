[model]
name = "cat_residual_w025"
family = "catboost_residual_correction"
residual_weight = 0.25
base_scale = 1.06
base_shift = -0.008
base_season_decay = 0.85
[model.base_params]
iterations = 300
depth = 8
learning_rate = 0.035
l2_leaf_reg = 3.0
subsample = 0.7
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "Logloss"
eval_metric = "BrierScore"
allow_writing_files = false
verbose = false
[model.residual_params]
iterations = 200
depth = 4
learning_rate = 0.03
l2_leaf_reg = 10.0
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "RMSE"
allow_writing_files = false
verbose = false
