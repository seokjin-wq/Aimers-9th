[model]
name = "catboost_ensemble3_shift"
family = "catboost_ensemble"
native_categorical = true
seeds = [17, 42, 73]
prediction_shift = -0.01
[model.params]
iterations = 300
depth = 6
learning_rate = 0.05
l2_leaf_reg = 3.0
subsample = 0.7
thread_count = 8
task_type = "CPU"
loss_function = "Logloss"
eval_metric = "BrierScore"
allow_writing_files = false
verbose = false
