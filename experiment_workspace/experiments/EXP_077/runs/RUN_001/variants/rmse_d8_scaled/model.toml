[model]
name = "catreg_d8_i300_decay85_scaled"
family = "catboost_regressor"
native_categorical = true
season_decay = 0.85
prediction_scale = 1.06
prediction_shift = -0.008
[model.params]
iterations = 300
depth = 8
learning_rate = 0.035
l2_leaf_reg = 3.0
subsample = 0.7
random_seed = 42
thread_count = 8
task_type = "CPU"
loss_function = "RMSE"
eval_metric = "RMSE"
allow_writing_files = false
verbose = false

