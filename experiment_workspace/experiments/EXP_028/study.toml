[study]
id = "028_eda_individual_features"
description = "EDA 파생 피처 개별 스크리닝"
hypothesis = "묶음 추가에서 상쇄된 EDA 피처 중 일부는 최신 main60+team+GPU 기준에서 단독으로 Brier를 개선한다"
protocol = "holdout_2024"
change_scope = ["features"]
control = "main60_control"

[[variants]]
name = "main60_control"
model = "catboost_gpu_d6_i600_lr025_b128"
features = "main60_cat_batter_team"
change = "control: GPU main60"

