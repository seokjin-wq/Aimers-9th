[study]
id = "074_safe_trackman_context"
description = "익명 투수 연결 폐기 후 안전한 Trackman 상황 집계 재검증"
hypothesis = "선수 연결은 불안정하지만, 2019~2023 공식 Trackman만으로 만든 손 유형×카운트 물리·구종 평균은 검증 행 집계 없이 추가 신호를 줄 수 있다."
protocol = "holdout_2024"
change_scope = ["features"]
control = "success_k50_control"

[[variants]]
name = "success_k50_control"
model = "catboost_d8_decay085"
features = "main69_season_success_k50"
change = "control: EXP_073의 k=50 당해 시즌 성공률"

[[variants]]
name = "track_physics"
model = "catboost_d8_decay085"
features = "main75_success_k50_track_physics"
change = "control 대비 과거 Trackman 손×카운트 물리 평균 6개 추가"

[[variants]]
name = "track_pitchmix"
model = "catboost_d8_decay085"
features = "main72_success_k50_track_pitchmix"
change = "control 대비 과거 Trackman 손×카운트 구종군 비율 3개 추가"

[[variants]]
name = "track_all"
model = "catboost_d8_decay085"
features = "main78_success_k50_track_all"
