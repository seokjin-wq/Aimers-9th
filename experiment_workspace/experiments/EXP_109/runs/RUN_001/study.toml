[study]
id = "109_latest_catboost_regularization"
description = "Latest CatBoost local regularization sweep"
hypothesis = "The expanded 72-feature representation may prefer nearby regularization settings different from the early 55-feature model, improving probability calibration without changing row-independent inputs."
protocol = "holdout_2024"
change_scope = ["model"]
control = "regularization_control"

[[variants]]
name = "regularization_control"
model = "catboost_d8_decay085"
features = "main72_cat_count_hands_same_pitchmix"
change = "control: l2=3, random_strength=1, subsample=0.7, rsm=1"

[[variants]]
name = "l2_1"
model = "catboost_d8_decay085_l2_1"
features = "main72_cat_count_hands_same_pitchmix"
change = "l2_leaf_reg 3 -> 1 only"

[[variants]]
name = "l2_5"
model = "catboost_d8_decay085_l2_5"
features = "main72_cat_count_hands_same_pitchmix"
change = "l2_leaf_reg 3 -> 5 only"

[[variants]]
name = "l2_8"
model = "catboost_d8_decay085_l2_8"
features = "main72_cat_count_hands_same_pitchmix"
change = "l2_leaf_reg 3 -> 8 only"

[[variants]]
name = "random_strength_05"
model = "catboost_d8_decay085_rs05"
features = "main72_cat_count_hands_same_pitchmix"
change = "random_strength 1 -> 0.5 only"

[[variants]]
name = "random_strength_15"
model = "catboost_d8_decay085_rs15"
features = "main72_cat_count_hands_same_pitchmix"
change = "random_strength 1 -> 1.5 only"

[[variants]]
name = "subsample_08"
model = "catboost_d8_decay085_sub08"
features = "main72_cat_count_hands_same_pitchmix"
change = "subsample 0.7 -> 0.8 only"

[[variants]]
name = "rsm_09"
model = "catboost_d8_decay085_rsm09"
features = "main72_cat_count_hands_same_pitchmix"
change = "rsm 1.0 -> 0.9 only"
