[study]
id = "096_late_history_decomposition"
description = "Late-inning pitcher-history contribution decomposition"
hypothesis = "The late-inning pitcher-history block contains one or two useful slopes and noisy remainder; isolating success, reverse, and middle-location histories can improve over the full block."
protocol = "holdout_2024"
change_scope = ["features"]
control = "same_hand_control"

[[variants]]
name = "same_hand_control"
model = "catboost_d8_decay085"
features = "main72_cat_count_hands_same_pitchmix"
change = "control: EXP_090 same-hand pitch-mix base"

[[variants]]
name = "late_success_only"
model = "catboost_d8_decay085"
features = "main73_same_pitchmix_late_success"
change = "add late_inning_x_pitcher_success only"

[[variants]]
name = "late_reverse_only"
model = "catboost_d8_decay085"
features = "main73_same_pitchmix_late_reverse"
change = "add late_inning_x_pitcher_reverse only"

[[variants]]
name = "late_middle_only"
model = "catboost_d8_decay085"
features = "main73_same_pitchmix_late_middle"
change = "add late_inning_x_pitcher_middle only"

[[variants]]
name = "late_success_reverse"
model = "catboost_d8_decay085"
features = "main74_same_pitchmix_late_success_reverse"
change = "add late success and reverse interactions"

[[variants]]
name = "late_success_middle"
model = "catboost_d8_decay085"
features = "main74_same_pitchmix_late_success_middle"
change = "add late success and middle interactions"

[[variants]]
name = "late_reverse_middle"
model = "catboost_d8_decay085"
features = "main74_same_pitchmix_late_reverse_middle"
change = "add late reverse and middle interactions"

[[variants]]
name = "late_all_three"
model = "catboost_d8_decay085"
features = "main75_same_pitchmix_late_history"
change = "EXP_090 reference: add all three late-inning pitcher-history interactions"
