[study]
id = "027_catboost_gpu"
description = "CatBoost GPU 학습 후보"
hypothesis = "GPU CatBoost의 다른 histogram과 categorical 계산이 CPU 모델보다 낮은 Brier 또는 유용한 앙상블 다양성을 만든다"
protocol = "holdout_2024"
change_scope = ["model"]
control = "cpu_control"

[[variants]]
name = "cpu_control"
model = "catboost_top_d6_i400_lr040"
features = "main60_cat_batter_team"
change = "control: CPU depth6 400 lr0.04"

